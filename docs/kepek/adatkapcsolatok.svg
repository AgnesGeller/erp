<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="720" viewBox="0 0 1120 720" role="img" aria-labelledby="title desc">
<title id="title">Díszkertek ERP – adatkapcsolati terv</title>
<desc id="desc">A közös ügyféltörzs a Kassza-projekt Munkalap-sémájában marad. A régi appok meglévő kapcsolatai megmaradnak. Az új ERP a kap projekt saját sémájába kerülne, külön jóváhagyás után. A szaggatott kapcsolat még csak terv.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9" fill="none" stroke="#386448" stroke-width="1.5"/></marker></defs>
<rect width="1120" height="720" fill="#f5f7f1"/>
<g font-family="Arial, sans-serif" fill="#193d2a">
<text x="40" y="48" font-size="27" font-weight="700">DÍSZKERTEK · Adatkapcsolati terv</text>
<text x="40" y="79" font-size="17">Jóváhagyásra váró architektúra – nem telepített rendszer</text>
<rect x="30" y="112" width="510" height="458" rx="8" fill="#fff" stroke="#a7bca8" stroke-width="2"/>
<text x="53" y="148" font-size="21" font-weight="700">Meglévő Kassza-projekt</text>
<rect x="54" y="176" width="462" height="104" rx="5" fill="#e8f0e4" stroke="#386448"/>
<text x="74" y="208" font-size="20" font-weight="700">Közös ügyfél- és címtörzs</text>
<text x="74" y="237" font-size="17">A Munkalapban kialakított elsődleges forrás</text>
<text x="74" y="262" font-size="16">Egy ügyfél → több cím → több munka</text>
<path d="M285 280V315" fill="none" stroke="#386448" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<rect x="54" y="325" width="462" height="88" rx="5" fill="#f5f7f1" stroke="#a7bca8"/>
<text x="74" y="357" font-size="20" font-weight="700">Munkalap · Kassza · Napi feladatok</text>
<text x="74" y="387" font-size="17">A meglévő adatkapcsolatok megmaradnak</text>
<rect x="54" y="440" width="462" height="100" rx="5" fill="#fff" stroke="#a7bca8"/>
<text x="74" y="472" font-size="20" font-weight="700">Munkabér és Kassza-pénzügy</text>
<text x="74" y="502" font-size="17">Külön maradnak; az ERP nem könyvel ide</text>
<text x="74" y="526" font-size="16">Az ügyféltörzs és a pénzmozgás külön kapcsolat</text>
<rect x="580" y="112" width="510" height="458" rx="8" fill="#fff" stroke="#a7bca8" stroke-width="2"/>
<text x="604" y="148" font-size="21" font-weight="700">Meglévő kap projekt</text>
<rect x="604" y="176" width="462" height="88" rx="5" fill="#f5f7f1" stroke="#a7bca8"/>
<text x="624" y="208" font-size="20" font-weight="700">Régi Árajánlat · saját quote_* adatok</text>
<text x="624" y="238" font-size="17">Meglévő ügyfélszinkron; változatlan forráskód</text>
<path d="M516 220H604" fill="none" stroke="#386448" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<rect x="604" y="320" width="462" height="220" rx="5" fill="#e8f0e4" stroke="#386448" stroke-width="2" stroke-dasharray="8 5"/>
<text x="624" y="354" font-size="22" font-weight="700">Új ERP – külön erp séma</text>
<text x="624" y="387" font-size="17">Személyek és saját szerepkörök</text>
<text x="624" y="416" font-size="17">Felmérés · ajánlat · munkák · karbantartás</text>
<text x="624" y="445" font-size="17">Anyagok · átvételek · pénzügy · jutalék</text>
<text x="624" y="474" font-size="17">Naptár · média · referencia · audit</text>
<text x="624" y="516" font-size="16" font-weight="700">Létrehozása még nincs jóváhagyva</text>
<path d="M516 252H560V300H592V425H604" fill="none" stroke="#386448" stroke-width="2" stroke-dasharray="7 5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="40" y="612" font-size="18" font-weight="700">Fejlesztés: elkülönített helyi adatbázis, az éles források írási kulcsai nélkül.</text>
<text x="40" y="645" font-size="17">Folytonos vonal: meglévő kapcsolat. Szaggatott vonal és keret: jóváhagyásra váró ERP-terv.</text>
<text x="40" y="678" font-size="17">A közös ügyfélazonosítók megmaradnak. Új előfizetés és régi appmódosítás nem része a tervnek.</text>
</g></svg>
